<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studijní Portál - KISK</title>
    <style>
        :root {
            --kisk-blue: #0000dc;     /* Sytá modrá pro hlavní pozadí */
            --kisk-yellow: #f4d371;   /* Žlutá barva pro rámečky */
            --card-light-bg: #eef2ff; /* Světle modré pozadí karet */
            --card-text: #0000dc;     /* Modrý text uvnitř karet */
            --text-muted: #3b3bc4;    /* Tmavší odstín modré pro doplňkový text v kartách */
            --white: #ffffff;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--kisk-blue);
            color: var(--white);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 80vh;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: 40px;
            border: 2px solid var(--kisk-yellow);
            border-radius: 16px;
            padding: 30px 20px;
            background: rgba(0, 0, 220, 0.4);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: var(--kisk-yellow);
            font-size: 2.2rem;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .subtitle {
            color: var(--white);
            font-size: 1.1rem;
            font-weight: 400;
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: var(--card-light-bg);
            border-radius: 14px;
            padding: 30px 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            text-decoration: none;
            color: var(--card-text);
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 5px solid var(--kisk-yellow);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
            background: #ffffff;
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--card-text);
            margin-bottom: 10px;
        }

        .card-description {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Masarykova univerzita</h1> 
            <p class="subtitle">FF: KISK – Informační studia a knihovnictví</p> 
        </header>

        <main class="grid">
            <!-- Karta 1: Přehled studia -->
            <a href="overview.html" class="card">
                <div class="card-icon">🎓</div>
                <div class="card-title">Přehled studia</div>
                <div class="card-description">Předměty, plnění úkolů a studijní povinnosti.</div>
            </a>

            <!-- Karta 2: RSS Novinky -->
            <a href="news.html" class="card">
                <div class="card-icon">📰</div>
                <div class="card-title">Novinky</div>
                <div class="card-description">Sledování vybraných portálů a novinek přes RSS.</div>
            </a>
        </main>
    </div>

</body>
</html>
