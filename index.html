<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studijní Portál</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            min-height: 80vh;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            color: var(--primary-color);
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.2rem;
            font-weight: 400;
            margin-top: 0;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 30px 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #e1e8ed;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border-color: var(--accent-color);
        }

        .card-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .card-description {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <!-- Nahraďte názvem vaší univerzity -->
            <h1>Masarykova univerzita</h1> 
            <!-- Nahraďte názvem vašeho oboru -->
            <p class="subtitle">Studijní obor: FF B-ISK_ Informační studia a knihovnictví, bakalářský studijní program</p> 
        </header>

        <main class="grid">
            <!-- Karta 1: Přehled studia -->
            <a href="overview.html" class="card">
                <div class="card-icon">🎓</div>
                <div class="card-title">Přehled studia</div>
                <div class="card-description">Předměty, plnění úkolů a studijní povinnosti.</div>
            </a>

            <!-- Karta 2: RSS Novinky -->
            <!-- Pokud jste soubor pojmenovala jinak než zpravy.html, upravte název v href="" -->
            <a href="news.html" class="card">
                <div class="card-icon">📰</div>
                <div class="card-title">Novinky</div>
                <div class="card-description">Sledování vybraných portálů a novinek přes RSS.</div>
            </a>
        </main>
    </div>

</body>
</html>
